name: minimum-versions-publish

# Publish the audit minimum version table
# (cmax/scripts/1-audit/minimum-versions.json) to the GitHub Pages site of this
# repository. A "minimum" is the lowest version of a component that has no
# known applicable vulnerability.
#
# The site carries exactly one file:
#
#   https://semianalysisai.github.io/ClusterMAX/minimum-versions.json
#
# Do not add other files to the Pages site. The deploy replaces the whole site
# with the one-file directory that this job builds.
#
# Why GitHub Pages:
#   - The job needs no secret. The deploy authenticates with this run's own
#     OIDC token (`pages: write`, `id-token: write`). Nothing outside this
#     repository holds a token that can write the public table.
#   - The job creates no commit, tag, or release, so the release list stays
#     the list of command line releases.
#   - The address is stable, served from a CDN, and readable without
#     authentication, so `cmax audit security` and the website can both read it.
#
# Why this job exists:
#   - `cmax audit security` fetches that public address on startup. A pip
#     installation carries a read-only table inside the installed package, so
#     the public copy is the one way it gets current minimums.
#   - The website (SemiAnalysisAI/clustermax-web-oss) reads the same address
#     and renders it at https://www.clustermax.ai/minimum-versions.
#   - The table in this repository stays the single source of truth. This job
#     copies it. It never edits a minimum and it never runs the generator.
#   - The publish happens after a merge, never before review. The public copy
#     is therefore always equal to a reviewed state of master.
#
# What the published copy adds (see .github/scripts/minimum_pages.py):
#   - `refreshed`: when the daily `minimum-versions-refresh` job last completed
#     successfully. It moves every day, also when no minimum changed. The
#     command line warns when a failed fetch leaves it on a table whose
#     `refreshed` stamp is more than 7 days old.
#   - `changed`: when a minimum value last changed, from the Git history of
#     the committed table.
#   Every component block is copied byte for byte.

on:
  push:
    branches:
      - master
    paths:
      - cmax/scripts/1-audit/minimum-versions.json
      - .github/workflows/minimum-versions-publish.yml
      - .github/scripts/minimum_pages.py
  workflow_run:
    # Publish right after each refresh, so `refreshed` moves the same day.
    workflows:
      - minimum-versions-refresh
    types:
      - completed
  schedule:
    # 08:43 UTC each day, after the 07:17 UTC refresh. A safety net for a
    # missed `workflow_run` event or a failed deploy.
    - cron: '43 8 * * *'
  workflow_dispatch:

# Least privilege. Each job asks for what it needs.
permissions:
  contents: read

# One publish at a time. A scheduled run must not race a push run.
concurrency:
  group: minimum-versions-publish
  cancel-in-progress: false

env:
  MINIMUMS_PATH: cmax/scripts/1-audit/minimum-versions.json
  REFRESH_WORKFLOW: minimum-versions-refresh.yml
  PUBLIC_URL: https://semianalysisai.github.io/ClusterMAX/minimum-versions.json

jobs:
  build:
    # Only master is reviewed. The `github-pages` environment also rejects a
    # deploy from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the runs of `minimum-versions-refresh`.
      actions: read
      # Sign the published file with a build provenance attestation.
      id-token: write
      attestations: write
    outputs:
      refreshed: ${{ steps.build.outputs.refreshed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The `changed` stamp comes from the history of the table.
          fetch-depth: 0

      - name: Find when the upstream feeds were last checked
        id: refreshed
        env:
          GH_TOKEN: ${{ github.token }}
        # The latest successful `minimum-versions-refresh` run is the last time
        # the feeds were read end to end. A run that opened a pull request and a
        # run that found nothing both count; a failed run does not, so a broken
        # refresh shows as an aging stamp rather than a fresh one. This step
        # never fails the job. The build step keeps the published value when
        # this lookup fails.
        continue-on-error: true
        run: |
          set -uo pipefail
          stamp="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${REFRESH_WORKFLOW}/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty')"
          echo "the upstream feeds were last checked at ${stamp:-an unknown time}"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Build the Pages site
        id: build
        env:
          REFRESHED: ${{ steps.refreshed.outputs.stamp }}
        run: >-
          python3 .github/scripts/minimum_pages.py
          --table "$MINIMUMS_PATH"
          --out "$RUNNER_TEMP/pages"
          --refreshed "$REFRESHED"
          --previous-url "$PUBLIC_URL"

      - name: Check that the site carries one file
        run: |
          set -euo pipefail
          files="$(find "$RUNNER_TEMP/pages" -mindepth 1 -printf '%P\n')"
          if [ "$files" != "minimum-versions.json" ]; then
            echo "::error::the Pages site must carry only minimum-versions.json. It carries: $files"
            exit 1
          fi

      - name: Attest the published file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pages/minimum-versions.json

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}minimum-versions.json
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check the public address
        # The CDN can take a minute to serve a new deploy. This step reports
        # what the address serves now and never fails the job. A stale public
        # copy cannot produce a wrong verdict: the command line refuses a
        # fetched table that is older than the installed table.
        env:
          WANT_REFRESHED: ${{ needs.build.outputs.refreshed }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["PUBLIC_URL"]
          want = os.environ.get("WANT_REFRESHED", "")
          served = None
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as answer:
                      served = json.loads(answer.read(4_000_000).decode("utf-8")).get("refreshed")
              except (urllib.error.URLError, ValueError, OSError) as exc:
                  print(f"attempt {attempt}: {url} could not be read ({exc})")
              else:
                  print(f"attempt {attempt}: {url} serves refreshed {served}")
                  if served == want:
                      break
              if attempt < 6:
                  time.sleep(20)

          if served == want:
              summary = f"`{url}` serves the table refreshed {want}."
          else:
              summary = f"`{url}` serves refreshed {served}, and this run published {want}. The CDN is probably still updating."
              print(f"::warning::{summary}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"### Minimum versions publish\n\n{summary}\n")
          PY
