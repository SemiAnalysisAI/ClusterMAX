name: CodeQL

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]
  schedule:
    - cron: "30 5 * * 1"

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        name: Detect languages present on this branch
        run: |
          langs=()
          if git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -q .; then
            langs+=("actions")
          fi
          if git ls-files -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' ':!:*node_modules*' | grep -q .; then
            langs+=("c-cpp")
          fi
          if git ls-files -- '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' ':!:*node_modules*' | grep -q .; then
            langs+=("javascript-typescript")
          fi
          if git ls-files -- '*.py' | grep -q .; then
            langs+=("python")
          fi
          printf -v joined '"%s",' "${langs[@]}"
          echo "languages=[${joined%,}]" >> "$GITHUB_OUTPUT"
          echo "Detected: [${joined%,}]"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
