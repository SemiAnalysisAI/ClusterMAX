name: python-tests

on:
  pull_request:
    branches: [master, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master, 'release/**']
    paths:
      - 'bench/**'
      - 'cmax/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/requirements/**'
      - '.github/workflows/python-nightly.yml'
      - '.github/workflows/python-tests.yml'
      - '.github/workflows/minimum-versions-refresh.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/requirements/minimum-versions.txt

      - name: Install pinned pip
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Select tests
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-tests') }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL_LABEL" = true ]; then
            selection=ALL
          else
            selection=$(python .github/scripts/select_tests.py --base "$BASE_SHA")
          fi
          printf '%s\n' "${selection:-<none>}" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo 'tests<<EOF'
            if [ "$selection" != ALL ]; then printf '%s\n' "$selection"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "all=$([ "$selection" = ALL ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "none=$([ -z "$selection" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != pull_request ] || [ "$selection" = ALL ]; then
            package=true
          else
            package=$(git diff --name-only "$BASE_SHA...HEAD" | grep -qE '^(cmax/|pyproject\.toml$|setup\.py$)' && echo true || echo false)
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Install test runner
        if: steps.select.outputs.none != 'true' || steps.select.outputs.package == 'true'
        run: python -m pip install pytest pytest-xdist pyyaml prompt-toolkit

      - name: Run Python tests
        if: steps.select.outputs.none != 'true'
        env:
          ALL: ${{ steps.select.outputs.all }}
          TESTS: ${{ steps.select.outputs.tests }}
        run: |
          if [ "$ALL" = true ]; then
            python -m pytest -q
          else
            mapfile -t files <<< "$TESTS"
            python -m pytest -q "${files[@]}"
          fi

      - name: Smoke-test checkout-free public wheel
        if: steps.select.outputs.package == 'true'
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/clustermax-wheel .
          python -c 'import glob, zipfile; wheel = glob.glob("/tmp/clustermax-wheel/clustermax-*.whl")[0]; names = zipfile.ZipFile(wheel).namelist(); assert not any("__pycache__" in name or name.endswith((".pyc", ".pyo")) for name in names)'
          python -m venv /tmp/clustermax-wheel-venv
          /tmp/clustermax-wheel-venv/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          /tmp/clustermax-wheel-venv/bin/pip install /tmp/clustermax-wheel/clustermax-*.whl
          cd /tmp
          /tmp/clustermax-wheel-venv/bin/cmax audit security --show
          /tmp/clustermax-wheel-venv/bin/cmax audit --show
          /tmp/clustermax-wheel-venv/bin/cmax audit --standalone --show
          /tmp/clustermax-wheel-venv/bin/cmax audit --help | grep -F "full cluster configuration and health audit"
          /tmp/clustermax-wheel-venv/bin/cmax audit security --help | grep -F "focused, read-only security report"
          if /tmp/clustermax-wheel-venv/bin/cmax init 2>/dev/null; then exit 1; fi
          /tmp/clustermax-wheel-venv/bin/cmax audit security --standalone --dry-run -o yaml > /tmp/clustermax-security-plan.yaml
          grep -q '^audit_profile:' /tmp/clustermax-security-plan.yaml
          /tmp/clustermax-wheel-venv/bin/python -c 'from cmax.security import find_runtime_root; assert find_runtime_root().is_dir()'
          /tmp/clustermax-wheel-venv/bin/python -c 'from cmax.security import find_runtime_root; root = find_runtime_root(); assert root.name == "cmax"; assert (root / "cmax.yaml").is_file(); assert (root / "scripts/1-audit/run.sh").is_file()'
          /tmp/clustermax-wheel-venv/bin/python -c 'import cmax; from importlib.metadata import version; assert cmax.__version__ == version("clustermax")'
