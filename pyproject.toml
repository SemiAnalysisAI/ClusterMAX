[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clustermax"
dynamic = ["version"]
description = "ClusterMAX GPU cluster audit and security CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SemiAnalysis"}]
maintainers = [{name = "SemiAnalysis"}]
dependencies = ["prompt-toolkit>=3.0.52,<4", "PyYAML>=6"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://clustermax.semianalysis.com/"
Documentation = "https://www.clustermax.ai/criteria"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
cmax = "cmax.cli:main"

[tool.setuptools]
packages = ["cmax"]
include-package-data = false

[tool.setuptools.package-data]
cmax = [
  "cmax.yaml",
  "scripts/1-audit/*.json",
  "scripts/1-audit/*.py",
  "scripts/1-audit/*.sh",
  "scripts/1-audit/checks/*.py",
  "scripts/1-audit/checks/fabric/*.py",
  "scripts/1-audit/checks/gpu/*.py",
  "scripts/1-audit/checks/system/*.py",
]

[tool.check-wheel-contents]
# The audit runs these Python files as package resources through their paths.
ignore = ["W004"]

# --- Static analysis (report-only; wired into the Nix flake analysis-* targets) ---
# These configs make the analyzers usable both inside `nix build .#analysis` and
# directly (ruff/mypy/bandit) from a plain checkout.

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tests/audit/fixtures"]

[tool.ruff.lint]
# A sensible default rule set. Reports only — nothing gates on these.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Non-strict: the codebase is not annotated yet, so surface only real errors.
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
# Test fixtures and the suite are not shipped code.
exclude_dirs = ["tests"]
